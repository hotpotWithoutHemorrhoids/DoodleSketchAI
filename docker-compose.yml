version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: doodlesketchai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: doodlesketchai
      MYSQL_USER: doodlesketch
      MYSQL_PASSWORD: doodlesketch123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - doodlesketch-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: doodlesketchai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doodlesketch-network

  # Python FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doodlesketchai-backend
    environment:
      DATABASE_URL: mysql+pymysql://doodlesketch:doodlesketch123@mysql:3306/doodlesketchai
      REDIS_URL: redis://redis:6379
      CPP_SERVICE_URL: cpp-server:50051
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - doodlesketch-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # C++ 服务端
  cpp-server:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: doodlesketchai-cpp
    ports:
      - "50051:50051"
    volumes:
      - ./cpp-server:/app
      - models_data:/app/models
      - uploads_data:/app/uploads
    networks:
      - doodlesketch-network
    command: ./cpp_server --port 50051

  # Vue3 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doodlesketchai-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    networks:
      - doodlesketch-network
    command: npm run dev

  # Nginx 反向代理 (生产环境)
  nginx:
    image: nginx:alpine
    container_name: doodlesketchai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - doodlesketch-network
    profiles:
      - production

volumes:
  mysql_data:
  redis_data:
  models_data:
  uploads_data:

networks:
  doodlesketch-network:
    driver: bridge
